#cloud-config
# =============================================================================
# HealDeploy — VM Bootstrap Configuration (cloud-init)
# =============================================================================
# Prepares an Ubuntu 22.04 LTS host for hosting the HealDeploy Flask web application.
# Configures system prerequisites, dedicated non-root account, release directories,
# Nginx reverse proxy, and systemd service unit.
# =============================================================================

package_update: true
package_upgrade: false

packages:
  - python3
  - python3-venv
  - python3-pip
  - nginx
  - curl
  - git

users:
  - default
  - name: healdeploy
    gecos: HealDeploy Service Account
    system: true
    shell: /bin/bash
    homedir: /opt/healdeploy
    lock_passwd: true

write_files:
  # ── Nginx reverse proxy configuration ────────────────────────────────────────
  - path: /etc/nginx/sites-available/healdeploy
    owner: root:root
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          # Proxy all HTTP requests to Gunicorn on localhost:8000
          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 30s;
          }
      }

  # ── systemd service unit template ───────────────────────────────────────────
  - path: /etc/systemd/system/healdeploy.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=HealDeploy Flask Web Application (Gunicorn)
      After=network.target

      [Service]
      Type=simple
      User=healdeploy
      Group=healdeploy
      WorkingDirectory=/opt/healdeploy/current
      Environment="PATH=/opt/healdeploy/current/.venv/bin:/usr/local/bin:/usr/bin:/bin"
      EnvironmentFile=-/opt/healdeploy/current/.env
      ExecStart=/opt/healdeploy/current/.venv/bin/gunicorn --bind 127.0.0.1:8000 --workers 2 --timeout 30 --access-logfile - --error-logfile - "app.app:create_app()"
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Directory layout for versioned releases ─────────────────────────────────
  - mkdir -p /opt/healdeploy/releases
  - mkdir -p /opt/healdeploy/shared
  - touch /opt/healdeploy/stable_release.txt
  - chown -R healdeploy:healdeploy /opt/healdeploy
  - chmod -R 755 /opt/healdeploy

  # ── Activate Nginx site ─────────────────────────────────────────────────────
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/healdeploy /etc/nginx/sites-enabled/healdeploy
  - nginx -t
  - systemctl restart nginx
  - systemctl enable nginx

  # ── Register systemd service ────────────────────────────────────────────────
  # Note: The service is registered but NOT started yet because the first release
  # (/opt/healdeploy/current) will be deployed by the Jenkins CI/CD pipeline in Phase 4.
  - systemctl daemon-reload

final_message: "HealDeploy cloud-init bootstrap completed successfully at $TIMESTAMP"
